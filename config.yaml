# Polymarket copy-trade backtester configuration.
# Every threshold the spec calls "a configurable default" lives here.

db_path: data/polybt.duckdb
cache_dir: data/cache
output_dir: output

split:
  # Wallets are selected on trades before the cutoff and tested only on trades after it.
  cutoff_date: null            # YYYY-MM-DD; null = today minus cutoff_days_ago
  # 90 days so the go rule's "positive in 2 of the last 3 30-day periods" has three test periods to look at.
  cutoff_days_ago: 90
  selection_lookback_days: 365 # how much history before the cutoff to ingest and score

http:
  timeout_s: 30
  max_retries: 8
  backoff_s: 2.0
  # Requests per second per host. Polymarket's published limits (docs.polymarket.com/api-reference/rate-limits,
  # sliding 10 s windows, throttled by Cloudflare rather than rejected): Data API 1,000/10 s general and
  # 200/10 s on /trades; CLOB 9,000/10 s general, 1,000/10 s on /prices-history, 1,500/10 s on /book.
  # These defaults stay well under the published limits.
  requests_per_second:
    data-api.polymarket.com: 12  # /activity returns 429s well below the published general limit
    clob.polymarket.com: 60
    gamma-api.polymarket.com: 15
  # Requests run in parallel threads; the per-host rates above still cap the total.
  workers: 8
  # Responses that can still change (latest activity page, open markets, leaderboards)
  # are reused for this long. Immutable responses (closed price windows) are cached forever.
  mutable_ttl_s: 21600
  activity_page_size: 500
  activity_offset_cap: 3000    # Data API rejects deep offsets; we re-window by timestamp past this
  # Stop pulling a wallet past this many activity rows (~65 a day over the window). Such wallets are
  # market makers or bots the trades-per-day filter would reject anyway; they're rejected as "capped".
  max_activity_rows: 30000
  # Before a full download, one request for the newest 500 rows: a wallet whose recent activity runs
  # above this many rows a day (several times the trades-per-day filter) is skipped as high-frequency.
  prescreen_rows_per_day: 150

discovery:
  seed_wallets: []             # always included, lowercase 0x addresses
  max_candidates: 600          # cheap: most are bots screened out with one request each
  # LOOKAHEAD WARNING: every Polymarket leaderboard, all-time included, ranks wallets partly on profit
  # made after the cutoff, i.e. inside the test period. A run that discovered wallets on monthly boards
  # showed 5 of 6 "GO" wallets earning most of their profit in exactly that month. Off by default;
  # discovery uses wallets active in markets that closed before the cutoff instead.
  leaderboard:
    enabled: false
    path: /v1/leaderboard
    page_size: 50
    pages: 4
    # Several boards so losers and high-volume wallets are included, not just today's top PnL.
    queries:
      - {category: OVERALL, timePeriod: ALL, orderBy: PNL}
      - {category: OVERALL, timePeriod: MONTH, orderBy: PNL}
      - {category: OVERALL, timePeriod: ALL, orderBy: VOL}
      - {category: CRYPTO, timePeriod: ALL, orderBy: PNL}
  active_in_markets:
    enabled: true
    top_markets: 300           # highest-volume markets that closed in the selection window
    trades_per_market: 1000
    wallets_per_market: 15

categories:
  # A market is short-term crypto if its question or slug matches any of these (case-insensitive regex).
  short_term_crypto:
    - "up or down"
    - "updown"
    - "\\b(5|15)m\\b"
    - "-(5|15)m-"
    - "\\b(bitcoin|btc|ethereum|eth|solana|sol|xrp)\\b.*\\b(above|below|price)\\b.*\\b(am|pm|et)\\b"
  default: other

filters:
  min_resolved_trades: 200
  min_active_span_days: 90
  active_within_days: 30       # must have traded within this many days before the cutoff
  min_roi: 0.0                 # strictly greater than
  min_edge_pts: 3.0            # win rate minus avg entry price, in percentage points
  max_top3_profit_share: 0.40
  min_median_trade_usd: 20
  max_trades_per_day: 50
  wash_window_s: 3600
  # Share of buys that hit the other side of the same market within the window.
  # The spec's rule is zero tolerance; 5% lets a rare flip through while still flagging hedgers.
  max_wash_fraction: 0.05

price_history:
  fidelity_min: 1
  chunk_hours: 24              # one CLOB request covers this window
  pad_s: 3600                  # history pulled on each side of every trade
  # Each 1-minute, 24 h window takes the CLOB ~4 s to serve, so more workers than elsewhere;
  # the per-host request rate still caps the total.
  workers: 32

# Taker fees (see polybt/fees.py). Each market's own parameters are fetched from the CLOB
# (GET /clob-markets/{condition_id} -> fd.r / fd.e) and take precedence; this table is the fallback.
fees:
  fetch_market_info: true
  # v2: fee = shares * rate * p * (1 - p)                     (current docs, July 2026 onwards)
  # v1: fee = shares * p * rate * (p * (1 - p)) ** exponent    (earlier docs)
  # `python -m polybt fees` checks which one matches the wallets' real fills.
  formula: v2
  exponent: 1
  # Fee Structure V2 (effective March 30 2026; sports 0.03 -> 0.05 and crypto 0.072 -> 0.07 in July 2026).
  # Some sports markets listed before July still carry 0.03 - the per-market fetch handles that.
  category_rates:
    crypto: 0.07
    sports: 0.05
    economics: 0.05
    culture: 0.05
    weather: 0.05
    politics: 0.04
    finance: 0.04
    tech: 0.04
    mentions: 0.04
    geopolitics: 0.0
    default: 0.05
  # Fallback classification when a market has no fee details: Gamma's category/tags first, then these.
  category_patterns:
    crypto: ["\\b(bitcoin|btc|ethereum|eth|solana|sol|xrp|doge|crypto)\\b", "up or down", "updown"]
    sports: ["\\b(nfl|nba|mlb|nhl|ufc|fifa|premier league|champions league|vs\\.?|match|game \\d)\\b"]
    politics: ["\\b(election|president|senate|congress|governor|mayor|trump|biden|party|nominee)\\b"]
    geopolitics: ["\\b(war|ceasefire|invade|invasion|nato|sanction|missile|military)\\b"]
    economics: ["\\b(fed|interest rate|inflation|cpi|gdp|recession|unemployment|jobs report)\\b"]
    weather: ["\\b(temperature|hurricane|rain|snow|weather)\\b"]

simulate:
  delays_s: [10, 60, 300, 900]
  stake_usd: 10
  # flat: $stake per copy. proportional: $stake x (their buy / their median buy), capped at max_stake_multiple.
  sizing: [flat, proportional]
  max_stake_multiple: 5
  spread_penalty: 0.01
  spread_penalty_low_volume: 0.02
  low_volume_threshold_usd: 50000
  max_copy_price: 0.97
  min_order_usd: 1.0          # Polymarket's minimum marketable order; smaller exits ride to resolution

# Risk limits. Part of the shared engine, so they bind the backtest, paper and live identically.
risk:
  max_signal_age_s: 1800      # never act on a wallet fill older than this (e.g. after a restart)
  max_open_usd: null          # total cost basis allowed in open copies
  max_market_usd: null        # per market

# Paper / live trading (python -m polybt paper | live).
live:
  session: paper-1
  wallets: []                 # default: wallets marked GO in the last report
  poll_interval_s: 5          # per-cycle activity poll across all wallets
  resolution_check_s: 300
  sizing: flat
  # Live trading also needs POLYBT_PRIVATE_KEY (and POLYBT_FUNDER for a proxy wallet) in the environment,
  # `pip install py-clob-client-v2`, and the --confirm-live flag. Paper needs none of that.
  signature_type: 1

report:
  bootstrap_samples: 2000
  ci_level: 0.90
  seed: 7
  go_no_go:
    delay_s: 60
    min_copyable_trades: 100
    months_window: 3
    months_positive: 2
    month_days: 30
    min_wallets: 3
    sizing: flat
    # Fills in one market share one outcome. 100 fills in 5 markets is 5 bets, so also require breadth.
    min_markets: 30

# Weather-market forecasting backtest (python -m polybt wx-data / wx-eval). See polybt/weather.
weather:
  data_start: 2024-02-01       # forecasts as issued exist from Jan 2024 (Open-Meteo previous runs)
  test_days: 120               # the last 120 days are the test period; everything is fitted before it
  gamma_tags: [daily-temperature, temperature]   # daily-temperature is the daily city markets
  discovery_window_days: 7     # ~50 city-days a day; Gamma stops paging near 1,000 results
  max_events_per_window: 1000
  models: [ecmwf_ifs025, gfs_seamless, icon_seamless]
  leads: [1, 2]                # 1 = decide on the day (at decision_hour_local), 2 = the day before
  # Midnight local: the previous-runs forecast for the afternoon high was issued by the previous
  # evening, so this is when it is freshest relative to the market. At 08:00 the market already had
  # the overnight model runs and the morning's readings (first full run: model log loss 1.57 vs 1.29).
  decision_hour_local: 0
  max_price_age_h: 12          # a range needs a price print within this long before the decision
  price_fidelity_min: 30
  price_days_before: 3
  min_obs_per_day: 18          # station-days with fewer readings are not used
  bias_window_days: 30         # rolling bias: errors over the last 30 known days (seasonal/local drift)
  bias_window_min: 10          # fewer known days than this: use the long-run bias
  shrink_days: 10              # weight of the long-run estimate when blending with the window
  default_fee_rate: 0.05       # weather taker rate if a market's own rate is unknown
  spread: 0.02                 # thin markets: pay 2c over the last price
  edge_thresholds: [0.03, 0.05, 0.10]
  min_test_days: 60
  requests_per_second:
    aviationweather.gov: 2
    mesonet.agron.iastate.edu: 1
    previous-runs-api.open-meteo.com: 2

# Polymarket-Kalshi arbitrage measurement (python -m polybt arb-probe / arb-match). See polybt/arb.
arb:
  window_days: 7               # Polymarket open markets are walked by end-date window (paging stops near 1,000)
  horizon_days: 400
  min_poly_liquidity: 500
  kalshi_skip_prefixes: [KXMVE]   # multi-leg combo markets
  max_kalshi_event_pages: 100  # x200 events
  max_close_days: 7            # matched markets must close within this many days of each other
  grade_a_close_days: 2
  min_score: 0.30              # text similarity to be a candidate (sports wording differs a lot by venue)
  max_candidate_df: 3000       # words in more Kalshi markets than this aren't used to find candidates
  grade_a_score: 0.55
  snapshot_pairs: 300
  min_depth_usd: 50            # gate: dollars available at the best price on every leg
  min_grade_a_pairs: 30
  kalshi_fee_rate: 0.07        # x series fee multiplier when Kalshi reports one
  poly_fee_fallback: 0.05
  requests_per_second:
    api.elections.kalshi.com: 8

# Liquidity-rewards study, phase 1 (python -m polybt rw-probe / rw-scan). See polybt/rewards.
rewards:
  capital_usd: 1000            # per market, split across both sides
  quote_frac: 0.5              # quote at half the max spread from the midpoint (scores 25% of a quote at the mid)
  competition_mult: 2          # haircut: assume the resting competition doubles
  snapshots: 6
  snapshot_interval_s: 1200
  min_daily_usd: 1.0           # payouts under $1 a day are not paid
  min_markets: 10
  top_n: 10
  # Phase 2: paper market making (python -m polybt rw-paper). Fresh market pick each session.
  paper:
    minutes: 300               # a session; GitHub Actions jobs stop at 6 h
    interval_s: 60
    request_timeout_s: 5       # quoting loop only; a slow request skips that market for one cycle
    request_retries: 1
    min_pool: 20               # $/day; smaller pools are not worth a slot
    max_inventory_mult: 2      # stop quoting the side that would take inventory past 2 x the quote size
    markout_min: [5, 30, 120]
    # The one crowded-market loss so far (Bulgarian election, 3 days before the vote) was a market about to
    # resolve. Out-of-sample check from session 8 on: excluding those would have turned -$11 into +$18/day per $1k.
    min_days_to_end: 7
    tiers_used: [crowded]      # medium lost on every session; empty books on every one before that   # sessions 1-4: empty books lost on every session
    per_tier: 10
    # Market types whose information arrives in public jumps a bot sees first; each lost more than its
    # rewards in sessions 1-4 (regex on the question, case-insensitive).
    exclude_patterns:
      - "temperature|°[CF]|\\brain|\\bsnow|hurricane"
      - "best .*(model|ai)|ai model|openrouter|livebench|lmarena|leaderboard|(second|third|top)[- ]best|ai lab|image edit"
      - "views|video get|\\bposts?\\b|tweets?|truth social"
      - "released on|be released on"
      - "box office|opening weekend"
      - "up or down"
      - "\\bsay\\b|mention"
    tiers:
      thin_below: 50           # resting score: under this the book is effectively empty near the mid
      crowded_from: 2000

# Longshot backtest (python -m polybt ls-data / ls-eval). See polybt/longshot.
longshot:
  lookback_days: 365
  window_days: 7               # Gamma stops paging near 1,000 results: walk closed markets by end-date window
  max_per_window: 1000
  min_volume: 5000             # thinner markets can't take even a small bet near the quoted price
  horizons_days: [1, 3, 7, 14, 30]
  buckets: [0.01, 0.02, 0.03, 0.05, 0.10, 0.20]   # longshot price ceilings, each bucket above the previous
  fidelity_min: 60
  max_price_age_h: 24          # need a price within a day before the decision time
  side: favourite              # favourite: bet against the longshot. longshot: buy the cheap side
  spread: 0.01                 # pay this over the last price for the side bought
  fees: true                   # taker fee by category (v2 formula)
  test_days: 120
  min_events: 50
  min_annual: 0.10
