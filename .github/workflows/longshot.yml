# Longshot backtest: does buying the favourite against cheap longshots pay on Polymarket after costs?
# Results: run summary, the longshot-output artifact, and the longshot-results branch.
name: Longshot backtest

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "full: fetch markets + prices, then evaluate. eval: evaluate cached data. check: buy-the-longshot under three cost assumptions. live: live order books of open 10-20c longshots"
        type: choice
        options: [full, eval, check, live]
        default: full

permissions:
  contents: write

concurrency:
  group: longshot
  cancel-in-progress: false

jobs:
  longshot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: longshot-data-${{ github.run_id }}
          restore-keys: longshot-data-
      - name: Fetch markets and prices
        if: inputs.steps == 'full'
        run: python -m polybt ls-data 2>&1 | tee run.log
      - name: Evaluate
        if: inputs.steps == 'eval'
        run: python -m polybt ls-eval 2>&1 | tee run.log
      - name: Buy the longshot, three cost assumptions
        if: inputs.steps == 'check'
        run: |
          set -o pipefail
          run() {  # name, spread, max print age (h)
            python -m polybt ls-eval --side longshot --spread "$2" --max-age-h "$3" 2>&1 | tee -a run.log > /dev/null
            cp output/longshot/report.md "output/longshot/report-$1.md"
            cp output/longshot/bets.csv "output/longshot/bets-$1.csv"
          }
          run base 0.01 24
          run spread2c 0.02 24
          run strict 0.02 2
          { for n in base spread2c strict; do echo "# Scenario: $n"; echo; cat "output/longshot/report-$n.md"; echo; done; } \
            > output/longshot/report.md
      - name: Live order books of open longshots
        if: inputs.steps == 'live'
        run: |
          set -o pipefail
          python -m polybt ls-live 2>&1 | tee run.log
          cp output/longshot/live_check.md output/longshot/report.md
      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: longshot-data-${{ github.run_id }}
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p output/longshot
          if [ "$JOB_STATUS" != "success" ]; then
            { echo "## RUN FAILED"; echo; echo '```'; tail -n 40 run.log 2>/dev/null; echo '```'; } > output/longshot/summary.md
          else
            cp output/longshot/report.md output/longshot/summary.md
          fi
          cat output/longshot/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to longshot-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r output/longshot/. /tmp/results/ 2>/dev/null || true
          cp run.log /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q -b longshot-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Longshot results (${{ inputs.steps }}) from run ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" longshot-results
