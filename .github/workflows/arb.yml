# Polymarket-Kalshi arbitrage, phase 1: match and grade pairs, snapshot their books once, report.
# Results: run summary, the arb-output artifact, and the arb-results branch.
name: Arbitrage

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "probe: check endpoints only. match: pairs + one live snapshot"
        type: choice
        options: [probe, match]
        default: match

permissions:
  contents: write

jobs:
  arb:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Probe endpoints
        run: python -m polybt arb-probe 2>&1 | tee probe.log || true
      - name: Match, grade, snapshot
        if: inputs.steps == 'match'
        run: python -m polybt arb-match 2>&1 | tee run.log
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p output/arb
          if [ "$JOB_STATUS" != "success" ]; then
            { echo "## RUN FAILED"; echo; echo '```'; tail -n 30 run.log 2>/dev/null; echo '```'; } > output/arb/summary.md
          elif [ -f output/arb/report.md ]; then
            cp output/arb/report.md output/arb/summary.md
          else
            { echo "## Probe"; echo; echo '```'; cat probe.log; echo '```'; } > output/arb/summary.md
          fi
          cat output/arb/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arb-output
          path: |
            output/arb/
            probe.log
            run.log
          if-no-files-found: warn
      - name: Publish to arb-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r output/arb/. /tmp/results/ 2>/dev/null || true
          cp probe.log run.log /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q -b arb-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Arbitrage results (${{ inputs.steps }}) from run ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" arb-results
