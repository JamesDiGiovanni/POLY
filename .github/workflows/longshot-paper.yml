# Longshot forward paper test: every 4 hours, settle resolved bets, then buy new 10-20c longshots on paper
# against live order books. The ledger and report live on the longshot-paper branch.
name: Longshot paper test

on:
  schedule:
    - cron: "23 1,5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: longshot-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Ledger so far
        run: |
          git clone -q --single-branch --branch longshot-paper \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/ledger \
            || { mkdir -p /tmp/ledger && cd /tmp/ledger && git init -q -b longshot-paper; }
      - name: Settle, scan, buy on paper
        run: |
          set -o pipefail
          python -m polybt ls-paper --state /tmp/ledger 2>&1 | tee run.log
      - name: Publish ledger
        if: always()
        run: |
          cd /tmp/ledger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Paper run ${{ github.run_id }}" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" longshot-paper
          cat report.md >> "$GITHUB_STEP_SUMMARY"
