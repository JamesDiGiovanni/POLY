# Polymarket liquidity rewards, phase 1: estimate what a $1,000 two-sided quote earns per pool.
# Results: run summary, the rewards-output artifact, and the rewards-results branch.
name: Liquidity rewards

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "probe: check endpoints only. scan: six book snapshots 20 min apart"
        type: choice
        options: [probe, scan]
        default: scan

permissions:
  contents: write

jobs:
  rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Probe endpoints
        run: python -m polybt rw-probe 2>&1 | tee probe.log || true
      - name: Scan reward pools
        if: inputs.steps == 'scan'
        run: python -m polybt rw-scan 2>&1 | tee run.log
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p output/rewards
          if [ "$JOB_STATUS" != "success" ]; then
            { echo "## RUN FAILED"; echo; echo '```'; tail -n 30 run.log 2>/dev/null; echo '```'; } > output/rewards/summary.md
          elif [ -f output/rewards/report.md ]; then
            cp output/rewards/report.md output/rewards/summary.md
          else
            { echo "## Probe"; echo; echo '```'; cat probe.log; echo '```'; } > output/rewards/summary.md
          fi
          cat output/rewards/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewards-output
          path: |
            output/rewards/
            probe.log
            run.log
          if-no-files-found: warn
      - name: Publish to rewards-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r output/rewards/. /tmp/results/ 2>/dev/null || true
          cp probe.log run.log /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q -b rewards-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rewards results (${{ inputs.steps }}) from run ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rewards-results
