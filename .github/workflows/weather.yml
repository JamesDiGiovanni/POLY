# Weather-market forecasting backtest, phases 1-3: market inventory, data, and the early check
# (is a forecast model more accurate than the market's own prices?). Results: run summary, the
# weather-output artifact, and the weather-results branch.
name: Weather

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "probe: check data sources only. full: data + early check. eval: early check on cached data"
        type: choice
        options: [probe, full, eval]
        default: full

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q

      - name: Restore weather data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: weather-data-${{ github.run_id }}
          restore-keys: weather-data-

      - name: Probe data sources
        run: python -m polybt wx-probe 2>&1 | tee probe.log || true

      - name: Progress heartbeat
        if: inputs.steps != 'probe'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          touch run.log
          nohup bash -c '
            mkdir -p /tmp/hb && cd /tmp/hb && git init -q -b weather-progress
            while true; do
              sleep 300
              { date -u; df -h "$GITHUB_WORKSPACE" | tail -1; free -m | sed -n 2p; echo; tail -n 60 "$GITHUB_WORKSPACE/run.log"; } > progress.txt
              git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm progress
              git push -qf "https://x-access-token:$TOKEN@github.com/$REPO.git" weather-progress
            done' > /dev/null 2>&1 &

      - name: Data (markets, stations, forecasts, observations, prices)
        if: inputs.steps == 'full'
        run: python -m polybt wx-data 2>&1 | tee -a run.log

      - name: Early check
        if: inputs.steps != 'probe'
        run: python -m polybt wx-eval 2>&1 | tee -a run.log

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p output/weather
          if [ "$JOB_STATUS" != "success" ]; then
            { echo "## RUN FAILED"; echo; echo '```'; tail -n 30 run.log 2>/dev/null; echo '```'; } > output/weather/summary.md
          elif [ -f output/weather/scorecard.md ]; then
            cp output/weather/scorecard.md output/weather/summary.md
          else
            { echo "## Probe"; echo; echo '```'; cat probe.log; echo '```'; } > output/weather/summary.md
          fi
          cat output/weather/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save weather data
        if: always() && inputs.steps != 'probe'
        uses: actions/cache/save@v4
        with:
          path: data
          key: weather-data-${{ github.run_id }}

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-output
          path: |
            output/weather/
            probe.log
            run.log
          if-no-files-found: warn

      - name: Publish to weather-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp -r output/weather/. /tmp/results/ 2>/dev/null || true
          cp probe.log run.log /tmp/results/ 2>/dev/null || true
          find /tmp/results -name '*.csv' -size +40M -exec gzip -f {} \;
          cd /tmp/results
          git init -q -b weather-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Weather results (${{ inputs.steps }}) from run ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" weather-results
