# Liquidity rewards phase 2: paper market making. Each run is three parallel sessions (default 5 h), each
# quoting a different third of the selected markets; sessions accumulate on the mm-paper branch, whose
# report.md covers all of them.
name: Paper market making

on:
  # The 6-hourly schedule ran Oct 21-23; stopped after 500 crowded market-hours netted ~+$4.50/day per $1k
  # (below the +$10 bar for a live pilot). Run by hand if needed.
  workflow_dispatch:
    inputs:
      minutes:
        description: "session length in minutes (max ~330)"
        default: "300"
      interval:
        description: "seconds between re-quotes"
        default: "10"
      quote_frac:
        description: "quote distance from the midpoint, as a fraction of the max spread"
        default: "0.5"

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    concurrency:
      group: mm-paper-${{ matrix.shard }}
      cancel-in-progress: false
    env:
      S: run-${{ github.run_id }}-s${{ matrix.shard }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Earlier sessions
        run: |
          git clone -q --single-branch --branch mm-paper \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/mm-paper \
            || { mkdir -p /tmp/mm-paper && cd /tmp/mm-paper && git init -q -b mm-paper; }
      - name: Paper session
        run: python -m polybt rw-paper --session "$S" --shard "${{ matrix.shard }}/3" --minutes "${{ inputs.minutes || '300' }}" --interval "${{ inputs.interval || '10' }}" --quote-frac "${{ inputs.quote_frac || '0.5' }}" 2>&1 | tee run.log
      - name: Publish to mm-paper branch
        if: always()
        run: |
          [ -d "output/mm/$S" ] || exit 0
          cp run.log "output/mm/$S/" 2>/dev/null || true
          cd /tmp/mm-paper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "$S" && cp -r "$GITHUB_WORKSPACE/output/mm/$S" .
          git add "$S"
          git commit -q -m "Paper market-making session $S" || exit 0
          # Three shards push at about the same time: each adds only its own folder, so a rebase never conflicts.
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin mm-paper 2>/dev/null || true
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mm-paper && exit 0
            sleep $((i * 5))
          done
          exit 1

  report:
    needs: paper
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild report.md over every session
        run: |
          git clone -q --single-branch --branch mm-paper \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/mm-paper
          python -c "from pathlib import Path; from polybt.config import load; \
            from polybt.rewards.paper import report; c = load(); \
            print(report(Path('/tmp/mm-paper'), {**c['rewards'], **c['rewards']['paper']}))" > /dev/null
          cd /tmp/mm-paper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.md
          git commit -q -m "Report after run ${{ github.run_id }}" || exit 0
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mm-paper
          cat report.md >> "$GITHUB_STEP_SUMMARY"
